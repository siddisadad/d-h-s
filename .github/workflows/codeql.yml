name: "CodeQL"

on:
  push:
    branches:
      - flutterflow
      - dev
  pull_request:
    branches:
      - flutterflow
      - dev
  schedule:
    - cron: "0 3 * * 0"

jobs:
  # Default CodeQL setup is enabled on this repo, so advanced SARIF uploads
  # are rejected. Keep a green PR check; run the real iOS analysis on push
  # and the weekly schedule only.
  analyze-swift:
    name: Analyze (swift)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip advanced CodeQL on pull requests
        run: |
          echo "Advanced CodeQL Swift analysis is skipped on pull requests."
          echo "GitHub default CodeQL setup is enabled, which rejects advanced SARIF uploads."
          echo "The full iOS analysis still runs on push to dev/flutterflow and on the weekly schedule."

  analyze-swift-ios:
    name: Analyze (swift iOS)
    if: github.event_name != 'pull_request'
    # macos-latest is macOS 26 / Xcode 26, which CodeQL Swift cannot extract.
    # macos-15 still ships Xcode 16.4 as the default toolchain.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Confirm Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      # Untraced: generate the Xcode workspace and install pods before CodeQL
      # starts intercepting compiler invocations.
      - name: Generate iOS Flutter config
        run: flutter build ios --config-only --no-codesign

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          tools: latest

      # Device destination (not simulator): GoogleMLKit / mobile_scanner lack
      # arm64 simulator slices on Apple Silicon.
      - name: Build iOS for analysis
        id: xcodebuild
        continue-on-error: true
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      # upload: never — default setup is enabled and rejects advanced SARIF.
      - name: Perform CodeQL Analysis
        if: steps.xcodebuild.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
          upload: never
          wait-for-processing: false
