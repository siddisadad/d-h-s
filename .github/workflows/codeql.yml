name: "CodeQL"

on:
  push:
    branches:
      - flutterflow
      - dev
  pull_request:
    branches:
      - flutterflow
      - dev
  schedule:
    - cron: "0 3 * * 0"

jobs:
  analyze-swift:
    name: Analyze (swift)
    # macos-latest is macOS 26 / Xcode 26, which CodeQL Swift cannot extract.
    # macos-15 still ships Xcode 16.4 as the default toolchain.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Confirm Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      # Untraced: generate the Xcode workspace and install pods before CodeQL
      # starts intercepting compiler invocations.
      - name: Generate iOS Flutter config
        run: flutter build ios --config-only --no-codesign

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          tools: latest

      # Device destination (not simulator): GoogleMLKit / mobile_scanner lack
      # arm64 simulator slices on Apple Silicon.
      - name: Build iOS for analysis
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
