name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  build:
    name: Build Signed AAB
    uses: ./.github/workflows/android-build.yml
    with:
      build_type: 'appbundle'
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  deploy:
    name: Deploy to Google Play
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.track || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'internal') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: |
          cd android
          bundle install

      - name: Decode Google Play Service Account JSON
        run: echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > android/service-account.json

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: "./service-account.json"
          DEPLOY_TRACK: ${{ github.event.inputs.track || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'internal') }}
        run: |
          cd android
          bundle exec fastlane deploy track:$DEPLOY_TRACK
